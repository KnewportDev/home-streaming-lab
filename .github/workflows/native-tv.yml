name: Native TV checks

on:
  push:
    paths:
      - 'native-tv/**'
      - '.github/workflows/native-tv.yml'
  pull_request:
    paths:
      - 'native-tv/**'
      - '.github/workflows/native-tv.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: native-tv
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check interface JavaScript
        run: node --check home/home.js
      - name: Run offline tests
        run: node --test tools/test-inspect-tv.cjs tools/test-native-session.cjs tools/test-usb-diagnostic.cjs
      - name: Package browser preview
        env:
          VIZIO_PREVIEW_ARCHIVE: ${{ runner.temp }}/native-tv-preview-${{ github.sha }}.zip
          VIZIO_PAGES_DIR: ${{ runner.temp }}/native-tv-pages
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path.cwd().resolve()
          files = {
              'home/index.html': 'index.html',
              'home/home.css': 'home.css',
              'home/home.js': 'home.js',
              'home/config.example.json': 'config.json',
              'home/README.md': 'README.md',
              'LICENSE': 'LICENSE',
          }
          for source in files:
              candidate = Path(source)
              if candidate.is_symlink() or not candidate.is_file() or root not in candidate.resolve().parents:
                  raise SystemExit('Preview asset is missing or is not a regular project file: ' + source)
          pages = Path(os.environ['VIZIO_PAGES_DIR'])
          pages.mkdir()
          with ZipFile(os.environ['VIZIO_PREVIEW_ARCHIVE'], 'w', ZIP_DEFLATED) as archive:
              for source, destination in files.items():
                  archive.write(source, destination)
                  (pages / destination).write_bytes(Path(source).read_bytes())
          PY
      - name: Upload browser preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/native-tv-preview-${{ github.sha }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/native-tv-pages
          include-hidden-files: false

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: native-tv-pages-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish interface preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
